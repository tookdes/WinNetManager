name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build WinNetManager
        run: dotnet build WinNetManager.csproj -c Release
      - name: Run core tests
        run: dotnet test WinNetManager.Tests/WinNetManager.Tests.csproj -c Release
